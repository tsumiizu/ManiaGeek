{% extends 'base.html' %}
{% block content %}
  <style>
    /* Estilos específicos da página 404 */
    body {
      overflow: hidden; /* Impede qualquer tipo de scroll na página */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .error-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }

    /* Container da imagem cortada na cintura */
    .character-crop-container {
      position: relative;
      width: clamp(500px, 70vw, 1000px);   /* <-- Valores aumentados */
      height: clamp(1000px, 55vh, 800px);  /* <-- Valores aumentados */
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .character-img {
      width: 100%;
      height: auto;
      object-fit: cover;
      object-position: top center; /* Foca e alinha o topo do corte na cabeça */
      user-select: none;
      pointer-events: none;
    }

    /* Coordenadas e formatação do texto 404 em cima da placa */
    .sign-text {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(34px, 5vw, 68px);
      font-weight: 700;
      color: #1a1a1a; /* Cor escura estilo tinta/marcador sobre a placa */
      letter-spacing: 2px;
      line-height: 1;
      pointer-events: none;
    }

    /* Mensagem auxiliar abaixo da personagem */
    .error-footer-msg {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 150%;
    }

    .error-footer-msg p {
      font-family: var(--font-mono);
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 12px;
    }
  </style>
<body>
  <!-- Container do Erro 404 -->
  <main class="error-wrapper">

    <!-- Container com o corte da cintura para cima e placa -->
    <div class="character-crop-container">
      <img src="/static/media/sylviechan.webp" alt="Sylvie-chan com placa de erro" class="character-img">
      <div class="sign-text">404</div>
    </div>

    <!-- Mensagem de suporte e botão de retorno -->
    <div class="error-footer-msg">
      <p style="color: rgb(230, 131, 85);">Ops! A página que você está procurando não existe ou foi movida.</p>
      <a href="/" class="btn-primary">Voltar para o Início</a>
    </div>

  </main>

</body>
{% endblock %}
